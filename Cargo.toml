[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/example"]

[workspace.package]
description = "A cross-platform, iterator-based windowing library"
readme      = "README.md"
edition     = "2024"
authors     = ["Gabriel Lugo <dev.gabriel.lugo@gmail.com>"]
license     = "MIT OR Apache-2.0"
keywords    = ["windows", "windowing"]
categories  = ["game-development", "rendering", "gui"]
repository  = "https://github.com/GTLugo/ventana"

[workspace.dependencies]
