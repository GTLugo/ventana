[package]
name                 = "ventana-backend-auto"
description          = "A collection of first-party backends for Ventana"
version              = "0.0.2"
readme.workspace     = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
keywords.workspace   = true
categories.workspace = true
repository.workspace = true

[features]
default = []
serde = ["dep:serde", "hal/serde"]

x11 = ["dep:backend_x11"]
wayland = ["dep:backend_wayland"]

[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
log = "0.4"
serde = { version = "1.0", optional = true }

hal = { package = "ventana-hal", version = "0.0.4", path = "../ventana-hal" }

# Windows
backend_win32 = { package = "ventana-backend-win32", version = "0.0.4", path = "../ventana-backend-win32" }

# Linux
backend_wayland = { package = "ventana-backend-wayland", version = "0.0.3", path = "../ventana-backend-wayland", optional = true } # , optional = true
backend_x11 = { package = "ventana-backend-x11", version = "0.0.3", path = "../ventana-backend-x11", optional = true } # , optional = true

# MacOS
backend_appkit = { package = "ventana-backend-appkit", version = "0.0.1", path = "../ventana-backend-appkit" }
