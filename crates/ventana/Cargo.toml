[package]
name                 = "ventana"
description          = "A cross-platform, iterator-based windowing library"
version              = "0.0.4"
readme.workspace     = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
keywords.workspace   = true
categories.workspace = true
repository.workspace = true

[features]
default = ["auto-backend", "x11", "wayland"]
serde = ["dep:serde", "hal/serde"]

auto-backend = ["dep:backend"]
x11 = ["backend?/x11"]
wayland = ["backend?/wayland"]

[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
log = "0.4"
serde = { version = "1.0", optional = true }

hal = { package = "ventana-hal", version = "0.0.4", path = "../ventana-hal" }
backend = { package = "ventana-backend-auto", version = "0.0.2", path = "../ventana-backend-auto", optional = true }
