[package]
name    = "ventana"
version = "0.0.1"
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[features]
default = ["rwh_06"]
rwh_05  = ["dep:rwh_05", "ventana-hal/rwh_05", "ventana-backend-win32?/rwh_05"]
rwh_06  = ["dep:rwh_06", "ventana-hal/rwh_06", "ventana-backend-win32?/rwh_06"]
serde = ["dep:serde", "ventana-hal/serde"]

[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
log = "0.4"
thiserror = "2.0"
tracing = "0.1"
bitflags = "2.9"
cursor-icon = "1.1"
serde = { version = "1.0", optional = true }

#hal = { package = "ventana-hal", version = "*", path = "hal" }
#backend-win32 = { package = "ventana-backend-win32", version = "*", path = "src/backend/win32", optional = true }
#backend-x11 = { package = "ventana-backend-x11", version = "*", path = "src/backend/x11", optional = true }

rwh_05 = { package = "raw-window-handle", version = "0.5.2", features = ["std"], optional = true }
rwh_06 = { package = "raw-window-handle", version = "0.6", features = ["std"], optional = true }

[dependencies.ventana-hal]
version = "*"
path = "../ventana-hal"

# Windows
[target.'cfg(target_os = "windows")'.dependencies.ventana-backend-win32]
version = "*"
path = "../ventana-backend-win32"

# Linux
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_vendor = "apple"))))'.dependencies]
