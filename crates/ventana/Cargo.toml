[package]
name                 = "ventana"
description          = "A cross-platform, iterator-based windowing library"
version              = "0.0.1"
readme.workspace     = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
keywords.workspace   = true
categories.workspace = true
repository.workspace = true

[features]
default = ["rwh_06", "x11"]
serde = ["dep:serde", "ventana-hal/serde"]

rwh_05  = ["dep:rwh_05", "ventana-hal/rwh_05", "backend-win32/rwh_05", "backend-wayland?/rwh_05", "backend-x11?/rwh_05"] # backend-wayland?/rwh_05
rwh_06  = ["dep:rwh_06", "ventana-hal/rwh_06", "backend-win32/rwh_06", "backend-wayland?/rwh_06", "backend-x11?/rwh_06"] # backend-wayland?/rwh_06

x11 = ["dep:backend-x11"]
wayland = ["dep:backend-wayland"]

[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
log = "0.4"
cursor-icon = "1.2"
serde = { version = "1.0", optional = true }

#hal = { package = "ventana-hal", version = "*", path = "hal" }

rwh_05 = { workspace = true, optional = true }
rwh_06 = { workspace = true, optional = true }

[dependencies.ventana-hal]
version = "0.0.1"
path = "../ventana-hal"

# # Windows
[target.'cfg(target_os = "windows")'.dependencies]
backend-win32 = { package = "ventana-backend-win32", version = "0.0.1", path = "../ventana-backend-win32" }

# Linux
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_vendor = "apple"))))'.dependencies]
backend-wayland = { package = "ventana-backend-wayland", version = "0.0.1", path = "../ventana-backend-wayland", optional = true } # , optional = true
backend-x11 = { package = "ventana-backend-x11", version = "0.0.1", path = "../ventana-backend-x11", optional = true } # , optional = true