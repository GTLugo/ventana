[package]
name                 = "ventana-backend-wayland"
description          = "A cross-platform, iterator-based windowing library"
version              = "0.0.1"
readme.workspace     = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
keywords.workspace   = true
categories.workspace = true
repository.workspace = true

[features]
default = ["rwh_06"]
rwh_05  = ["dep:rwh_05", "ventana-hal/rwh_05"]
rwh_06  = ["dep:rwh_06", "ventana-hal/rwh_06"]

[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
log       = "0.4"
thiserror = "2.0"

bitflags = "2.9"
cursor-icon = "1.2"

rwh_05 = { package = "raw-window-handle", version = "0.5.2", features = ["std"], optional = true }
rwh_06 = { package = "raw-window-handle", version = "0.6", features = ["std"], optional = true }

# xkbcommon-dl = "0.4.2"
# xkbcommon = "0.9"

[dependencies.ventana-hal]
version = "0.0.1"
path = "../ventana-hal"

# not sure why, but sctk still tries to compile build scripts on other targets, so this guard is necessary to avoid erroneous warnings from rust-analyzer
[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_vendor = "apple"))))'.dependencies.sctk]
package = "smithay-client-toolkit"
version = "0.20.0"
